name: OFox-Build-LXX521

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 14.1
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'OrangeFox Device Tree (full git URL)'
        required: true
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: ''
      DEVICE_PATH:
        description: 'Device Path inside sync dir (e.g. device/lava/lxx521)'
        required: true
        default: ''
      DEVICE_NAME:
        description: 'Device Codename (e.g. lxx521)'
        required: true
        default: ''
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      PATCH_CORE_MAKEFILE:
        description: 'Replace build/make/core/Makefile with custom version from kotler-m1 (set false to keep stock)'
        required: true
        default: true
        type: boolean
      CUSTOM_MAKEFILE_URL:
        description: 'Raw URL of the custom core Makefile (used when PATCH_CORE_MAKEFILE is true)'
        required: false
        default: 'https://raw.githubusercontent.com/kotler-m1/android_device_lava_LXX521-recovery/PE-14/Makefile'

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Validate Inputs
      run: |
        fail=0
        for v in DEVICE_TREE DEVICE_TREE_BRANCH DEVICE_PATH DEVICE_NAME MANIFEST_BRANCH; do
          case "$v" in
            DEVICE_TREE)        val="${{ inputs.DEVICE_TREE }}" ;;
            DEVICE_TREE_BRANCH) val="${{ inputs.DEVICE_TREE_BRANCH }}" ;;
            DEVICE_PATH)        val="${{ inputs.DEVICE_PATH }}" ;;
            DEVICE_NAME)        val="${{ inputs.DEVICE_NAME }}" ;;
            MANIFEST_BRANCH)    val="${{ inputs.MANIFEST_BRANCH }}" ;;
          esac
          if [ -z "$val" ]; then
            echo "::error::Input $v is empty."
            fail=1
          fi
        done
        if [ "${{ inputs.PATCH_CORE_MAKEFILE }}" = "true" ] && \
           [ -z "${{ inputs.CUSTOM_MAKEFILE_URL }}" ]; then
          echo "::error::PATCH_CORE_MAKEFILE=true requires CUSTOM_MAKEFILE_URL."
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1

    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}image"
        echo "Replace Core Makefile: ${{ inputs.PATCH_CORE_MAKEFILE }}"
        echo "Custom Makefile URL: ${{ inputs.CUSTOM_MAKEFILE_URL }}"
        echo "::endgroup::"

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    
    # Install custom core Makefile (full replacement).
    #   PATCH_CORE_MAKEFILE=true  -> download CUSTOM_MAKEFILE_URL and
    #                                replace .../build/make/core/Makefile
 
      if: inputs.PATCH_CORE_MAKEFILE == true
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        MF=build/make/core/Makefile
        if [ ! -f "$MF" ]; then
          echo "::error::$MF not found after OrangeFox sync."
          exit 1
        fi

        URL="${{ inputs.CUSTOM_MAKEFILE_URL }}"
        echo "Downloading custom core Makefile: $URL"

        if ! curl -fsSL "$URL" -o /tmp/custom_Makefile; then
          echo "::error::Failed to download $URL"
          exit 1
        fi
        if [ ! -s /tmp/custom_Makefile ]; then
          echo "::error::Downloaded Makefile is empty."
          exit 1
        fi
        if head -1 /tmp/custom_Makefile | grep -qi '<!DOCTYPE\|<html'; then
          echo "::error::Downloaded file looks like HTML, not a Makefile (bad URL?)."
          exit 1
        fi
        if ! grep -q 'INTERNAL_VENDOR_RAMDISK_TARGET' /tmp/custom_Makefile; then
          echo "::error::Downloaded file does not reference INTERNAL_VENDOR_RAMDISK_TARGET — wrong file."
          exit 1
        fi

        echo "---- diff summary vs stock core/Makefile ----"
        diff -u "$MF" /tmp/custom_Makefile | head -40 || true
        echo "---------------------------------------------"

        cp /tmp/custom_Makefile "$MF"
        echo "Replaced $MF with custom version."

        echo "---- verification ----"
        if grep -q 'ifdef BOARD_PREBUILT_VENDOR_RAMDISK' "$MF"; then
          echo "✅ BOARD_PREBUILT_VENDOR_RAMDISK branch present."
          grep -A4 'ifdef BOARD_PREBUILT_VENDOR_RAMDISK' "$MF" | head -8 || true
        else
          echo "::warning::Custom Makefile does not contain BOARD_PREBUILT_VENDOR_RAMDISK — the small-ramdisk fallback will happen."
        fi

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        rm -rf out
        mka adbd ${{ inputs.BUILD_TARGET }}image
        echo "Done building your ${{ inputs.BUILD_TARGET }}.img"

    - name: Verify Vendor Ramdisk Size
      if: inputs.BUILD_TARGET == 'vendorboot'
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        OUT=out/target/product/${{ inputs.DEVICE_NAME }}
        VBOOT="$OUT/vendor_boot.img"
        if [ ! -f "$VBOOT" ]; then
          echo "::error::vendor_boot.img was not produced."
          exit 1
        fi
        SIZE=$(stat -c%s "$VBOOT")
        echo "vendor_boot.img size: $SIZE bytes ($(numfmt --to=iec $SIZE))"
        if [ "$SIZE" -lt 20000000 ]; then
          echo "::error::vendor_boot.img is only $SIZE bytes — the platform ramdisk is empty/AOSP-generated."
          echo "Check that BOARD_PREBUILT_VENDOR_RAMDISK is set and that core/Makefile actually honours it."
          echo "If you set PATCH_CORE_MAKEFILE=false, verify the manifest branch already supports the variable."
          exit 1
        fi

    - name: Detect Built Image and Compute MD5
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        OUT=out/target/product/${{ inputs.DEVICE_NAME }}
        if ls $OUT/OrangeFox*.img >/dev/null 2>&1; then
          IMG=$(ls $OUT/OrangeFox*.img | head -1)
          echo "IMG_FILE=$(basename $IMG)" >> $GITHUB_ENV
        elif [ -f "$OUT/vendor_boot.img" ]; then
          echo "IMG_FILE=vendor_boot.img" >> $GITHUB_ENV
        elif [ -f "$OUT/boot.img" ]; then
          echo "IMG_FILE=boot.img" >> $GITHUB_ENV
        elif [ -f "$OUT/recovery.img" ]; then
          echo "IMG_FILE=recovery.img" >> $GITHUB_ENV
        else
          echo "::warning::No primary output image detected; MD5 will be skipped."
          echo "IMG_FILE=" >> $GITHUB_ENV
          exit 0
        fi
        echo "MD5_IMG=$(md5sum $OUT/$IMG_FILE | cut -d ' ' -f 1)" >> $GITHUB_ENV

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/vendor_boot.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/boot.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        fail_on_unmatched_files: false
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}image
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}

    - name: Release Ramdisks (debug)
      if: inputs.BUILD_TARGET == 'vendorboot'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.*
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/ramdisk-recovery.*
        fail_on_unmatched_files: false
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
